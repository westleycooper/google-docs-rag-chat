[alembic]
script_location = packages/ragoogle-infra/src/ragoogle_infra/persistence/migrations
prepend_sys_path = packages/ragoogle-infra/src
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# Set RAGOOGLE_DATABASE_URL instead; env.py prefers it. This default only serves
# a local compose stack.
sqlalchemy.url = postgresql://ragoogle:ragoogle@localhost:5433/ragoogle

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
