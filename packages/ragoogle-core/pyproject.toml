[project]
name = "ragoogle-core"
version = "0.1.0"
description = "RAGDrive domain and application layers. Standard library only, by design."
requires-python = ">=3.12"
# ADR-0001: the domain layer imports only the standard library. This empty
# dependency list is the first line of that enforcement; tools/quality/layering.py
# is the second.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragoogle_core"]
