server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the one file whose name never changes -- it's the pointer
    # to which hashed assets to load. With no explicit Cache-Control it had
    # none of the immutable assets' guarantees but was still eligible for a
    # browser's heuristic disk cache (RFC 7234 4.2.2), which is exactly what
    # made "I refreshed and still don't see the change" possible: a normal
    # reload can serve a cached index.html pointing at yesterday's JS bundle
    # without ever asking the server. Forcing revalidation on every load is
    # cheap (a 304 costs nothing) and is what makes the hashed-asset caching
    # above safe to leave at a year.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The API is proxied under the same origin so SSE is not subject to a
    # preflight on every reconnect.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE needs these three: without them nginx buffers the stream and the
        # client sees the whole answer arrive at once, minutes late.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: a deep link must not 404 on reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
