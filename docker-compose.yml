name: ragoogle

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ragoogle
      POSTGRES_PASSWORD: ragoogle
      POSTGRES_DB: ragoogle
    ports:
      - "5433:5432"   # 5433 to avoid colliding with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragoogle -d ragoogle"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
