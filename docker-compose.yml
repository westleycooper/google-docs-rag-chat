name: ragoogle

# The full stack. `docker compose up` gives a working system; the only thing it
# cannot supply is API keys (see .env.example).
#
#   cp .env.example .env      # fill in VOYAGE_API_KEY, ANTHROPIC_API_KEY
#   docker compose up --build
#
#   chat          http://localhost:5173
#   architecture  http://localhost:5174
#   api docs      http://localhost:8000/docs

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragoogle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragoogle}
      POSTGRES_DB: ${POSTGRES_DB:-ragoogle}
    ports:
      - "5433:5432"   # 5433 to avoid colliding with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragoogle} -d ${POSTGRES_DB:-ragoogle}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Migrations run as their own one-shot service rather than at API startup.
  # Two API replicas racing to migrate the same database is a real failure mode,
  # and putting migrations in the entrypoint guarantees it under any scale-out.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      RAGOOGLE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ragoogle}:${POSTGRES_PASSWORD:-ragoogle}@postgres:5432/${POSTGRES_DB:-ragoogle}
      RAGOOGLE_EMBEDDING_DIMENSIONS: ${RAGOOGLE_EMBEDDING_DIMENSIONS:-1024}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      RAGOOGLE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ragoogle}:${POSTGRES_PASSWORD:-ragoogle}@postgres:5432/${POSTGRES_DB:-ragoogle}
      RAGOOGLE_VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      RAGOOGLE_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RAGOOGLE_CREDENTIAL_SECRET: ${RAGOOGLE_CREDENTIAL_SECRET:-}
      RAGOOGLE_EMBEDDING_MODEL: ${RAGOOGLE_EMBEDDING_MODEL:-voyage-3-large}
      RAGOOGLE_EMBEDDING_DIMENSIONS: ${RAGOOGLE_EMBEDDING_DIMENSIONS:-1024}
      RAGOOGLE_DEFAULT_CHAT_MODEL: ${RAGOOGLE_DEFAULT_CHAT_MODEL:-claude-opus-5}
      RAGOOGLE_RERANK_ENABLED: ${RAGOOGLE_RERANK_ENABLED:-true}
      RAGOOGLE_RETRIEVAL_LIMIT: ${RAGOOGLE_RETRIEVAL_LIMIT:-8}
      # Sized to the embedding provider's token budget: a 50-candidate rerank
      # exceeds a Voyage free-tier key's 10k tokens/minute outright.
      RAGOOGLE_CANDIDATE_LIMIT: ${RAGOOGLE_CANDIDATE_LIMIT:-50}
      RAGOOGLE_CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      # Container-network DNS names, so /topology can actually ping the other
      # two services (ADR-0006) rather than reporting them permanently unknown.
      RAGOOGLE_FRONTEND_URL: http://frontend
      RAGOOGLE_OBSERVABILITY_URL: http://observability
      RAGOOGLE_LOG_LEVEL: ${RAGOOGLE_LOG_LEVEL:-INFO}
      # ADR-0016. Required only to offer "Connect Google Drive"; unset leaves
      # the OAuth start endpoint returning a clear 503 instead of a broken
      # redirect (see google_oauth_client_id in settings.py).
      RAGOOGLE_GOOGLE_OAUTH_CLIENT_ID: ${RAGOOGLE_GOOGLE_OAUTH_CLIENT_ID:-}
      RAGOOGLE_GOOGLE_OAUTH_CLIENT_SECRET: ${RAGOOGLE_GOOGLE_OAUTH_CLIENT_SECRET:-}
      RAGOOGLE_GOOGLE_OAUTH_REDIRECT_URI: ${RAGOOGLE_GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/oauth/google/callback}
      RAGOOGLE_FRONTEND_PUBLIC_URL: ${RAGOOGLE_FRONTEND_PUBLIC_URL:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  observability:
    build:
      context: .
      dockerfile: apps/observability/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "5174:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
